<!DOCTYPE html>
<!-- Project by Kohinoor Narwal | GF202676017 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Summary -->
    <div class="summary">
      <div class="card income"><p>Income</p><h2 id="totalIncome">0.00</h2></div>
      <div class="card expense"><p>Expenses</p><h2 id="totalExpense">0.00</h2></div>
      <div class="card balance"><p>Balance</p><h2 id="balance">0.00</h2></div>
    </div>

    <!-- Add transaction form -->
    <form id="form">
      <input type="text" id="title" placeholder="Description (e.g. Salary)">
      <input type="number" id="amount" placeholder="Amount" min="0" step="0.01">
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <select id="category">
        <option>Salary</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Other</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <p id="error"></p>

    <!-- Filter -->
    <div class="filter">
      <label for="filter">Show:</label>
      <select id="filter">
        <option value="all">All</option>
        <option value="income">Income</option>
        <option value="expense">Expenses</option>
      </select>
    </div>

    <ul id="list"></ul>
  </div>
  <footer class="credit">Made by Kohinoor Narwal (GF202676017)</footer>
  <script src="script.js"></script>
</body>
</html>
